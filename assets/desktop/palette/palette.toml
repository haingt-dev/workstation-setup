# Rice palette input — the ONE place a colour decision is made.
#
# Change something here, run `bash scripts/desktop/gen-palette.sh`, review the
# diff, commit. Every generated artefact next to this file (KDE colour scheme,
# Konsole/kitty themes, tmux status colours, QML tokens, shell tokens) is
# derived from these values and is what the setup stages actually install —
# nothing recomputes at runtime. The generator also splices a palette block
# into assets/.config/starship/starship.toml, between its own markers.

name         = "FirewatchDusk"        # KDE colour-scheme name (no spaces)
display_name = "Firewatch Dusk"
wallpaper    = "firewatch-dusk.jpg"   # in ../wallpapers/, used for the desktop + lock screen

# Source colour for the Material You scheme.
#   auto  -> quantise the wallpaper and score the most usable colour
#   #hex  -> force it (what we do here: the auto pick was the forest green,
#            but the picture's SUBJECT is the orange sun — Hải's call 2026-09-07)
source_color = "#e8931c"

variant       = "tonal_spot"   # tonal_spot | expressive | fidelity | content | vibrant | neutral | monochrome
contrast      = 0.0            # -1.0 .. 1.0, Material contrast level
dark          = true

# How much of the source hue the NEUTRALS keep (1.0 = full Material You, which
# tints the background, the body text and every grey; 0.0 = pure grey).
# Anything near 1.0 makes a terminal look like night-light is on, because the
# text itself is cream rather than white. 0.25 keeps the family resemblance
# without the cast.
neutral_chroma = 0.25

# Card translucency used by our own plasmoids (0 = invisible, 1 = opaque).
card_alpha    = 0.82

# ---------------------------------------------------------------------------
# Terminal backdrop — a THIRD crop of the same wallpaper, rendered by
# scripts/desktop/60-wallpaper.sh and set as kitty's background_image.
#
# Why an image and not a translucent window: this wallpaper is nearly black
# (sky ~45/255, forest ~18/255), so at any opacity the glass showed almost
# nothing — and whatever window happened to sit underneath bled through the
# text instead (Hải, 2026-09-07). A fixed crop gives the terminal the picture's
# one bright feature and never changes with what is behind it.
#
# focus  = where the subject sits in the SOURCE image, as a fraction (the sun,
#          measured by finding the warmest bright blob). Re-measure when the
#          wallpaper changes.
# anchor = where that point lands in the terminal frame. Bottom-right, because
#          that is the emptiest corner of a shell: prompt and statusline live
#          there, long output does not.
# zoom   = how much of the source the frame covers (2.0 = a quarter of it).
# tint   = how far kitty dims the image toward the background colour before
#          drawing text on it. Applied by kitty, not baked into the file.
[terminal]
zoom   = 2.0
focus  = [0.504, 0.452]
anchor = [0.86, 0.86]
tint   = 0.35
