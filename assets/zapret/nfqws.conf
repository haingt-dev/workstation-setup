# nfqws (zapret) options — loaded by zapret.service as EnvironmentFile.
# Verified 2026-08-27 against FPT Telecom's SNI-RST DPI (store.steampowered.com,
# medium.com, luatkhoa.net): `multisplit` at 1,midsld passes; `fake,...badseq` does NOT.
# Edit here, then: sudo systemctl restart zapret
NFQWS_OPTS=--qnum=200 --user=nobody --dpi-desync=multisplit --dpi-desync-split-pos=1,midsld
