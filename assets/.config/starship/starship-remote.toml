# =============================================================================
# starship-remote.toml — glyph-free prompt for REMOTE / mobile sessions
# =============================================================================
# Activated by ~/.zshrc when $SSH_CONNECTION is set (ssh AND mosh), e.g. an
# iPad Termius session whose font lacks Nerd Font glyphs. Uses ONLY safe
# characters (letters, "…", "❯") — no Nerd Font PUA icons, no powerline
# separators — so it renders on any terminal/font. Local machine keeps the
# full Catppuccin powerline prompt in ~/.config/starship.toml (Nerd Font kitty).
# Keeps the Catppuccin palette so it still looks like "his" prompt, just plain.

palette = "catppuccin_macchiato"
add_newline = false

format = "$directory$git_branch$git_status$cmd_duration$status$character "

[directory]
style = "bold lavender"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " ro"
read_only_style = "red"

[git_branch]
symbol = ""
style = "mauve"
format = "[on $branch]($style) "

[git_status]
style = "peach"
format = "([$all_status$ahead_behind]($style) )"
ahead = "ahead ${count}"
behind = "behind ${count}"
diverged = "ahead ${ahead_count} behind ${behind_count}"
conflicted = "conflict "
up_to_date = ""
untracked = "?${count} "
stashed = "stash "
modified = "!${count} "
staged = "+${count} "
renamed = "renamed "
deleted = "x${count} "

[cmd_duration]
min_time = 500
style = "surface2"
format = "[took $duration]($style) "

[status]
disabled = false
style = "bold red"
format = "[$status]($style) "
map_symbol = false

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# --- Catppuccin Macchiato palette (matches the local prompt) ---
[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
